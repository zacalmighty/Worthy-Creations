# Netlify settings for the Worthy Creations site. Plain static site: no build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Images rarely change: let browsers cache them for a week. CSS/JS keep Netlify's default
# (revalidate every visit) because their file names don't change between deploys.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Repo-only files: never serve them on the live site.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/.gitignore"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/img/source/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true
